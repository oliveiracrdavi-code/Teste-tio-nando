<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code ASCII → Imagem</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #0f172aee; backdrop-filter: blur(8px);
    border-bottom: 1px solid #1e293b;
    padding: 12px 24px;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; }
  header span { font-size: 0.75rem; color: #64748b; }
  main {
    max-width: 680px; margin: 0 auto;
    padding: 28px 16px 60px;
    display: flex; flex-direction: column; gap: 16px;
  }
  label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; display: block; }
  textarea {
    width: 100%; height: 180px;
    background: #1e293b; color: #4ade80;
    border: 1px solid #334155; border-radius: 10px;
    font-family: monospace; font-size: 10.5px; line-height: 1.3;
    padding: 12px; resize: vertical; outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: #3b82f6; }
  .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button {
    padding: 11px 28px; font-size: 0.95rem; font-weight: 600;
    background: #2563eb; color: #fff;
    border: none; border-radius: 8px; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover { background: #1d4ed8; }
  button:active { transform: scale(0.97); }
  #timer { font-size: 0.95rem; color: #facc15; font-variant-numeric: tabular-nums; }
  #error { color: #f87171; font-size: 0.88rem; }
  #result {
    display: none;
    background: #1e293b; border: 1px solid #334155;
    border-radius: 12px; padding: 20px;
    text-align: center;
  }
  #output {
    max-width: 100%; border-radius: 8px;
    image-rendering: pixelated;
    border: 16px solid #fff;
    background: #fff;
  }
  .result-footer {
    display: flex; justify-content: center; gap: 12px;
    margin-top: 16px; flex-wrap: wrap;
  }
  #download {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 24px; background: #16a34a; color: #fff;
    border-radius: 8px; text-decoration: none; font-weight: 600;
    font-size: 0.9rem; transition: background 0.15s;
  }
  #download:hover { background: #15803d; }
  #copy-btn {
    padding: 10px 20px; background: #475569; color: #fff;
    border: none; border-radius: 8px; cursor: pointer;
    font-size: 0.9rem; font-weight: 600; transition: background 0.15s;
  }
  #copy-btn:hover { background: #334155; }
  .tip {
    font-size: 0.78rem; color: #475569;
    text-align: center; margin-top: 4px;
  }
</style>
</head>
<body>
<header>
  <h1>QR Code ASCII → Imagem</h1>
  <span>converte no navegador · sem upload · gratuito</span>
</header>
<main>
  <div>
    <label for="input">Cole o QR code em texto (Ctrl+Enter para converter):</label>
    <textarea id="input" placeholder="▄▄▄▄▄▄▄▄▄...&#10;█ ▄▄▄▄▄ █ ...&#10;..."></textarea>
  </div>
  <div class="actions">
    <button onclick="convert()">⚡ Converter</button>
    <span id="timer"></span>
  </div>
  <div id="error"></div>
  <div id="result">
    <img id="output" alt="QR Code gerado">
    <div class="result-footer">
      <a id="download" download="qrcode.png">⬇ Baixar PNG</a>
      <button id="copy-btn" onclick="copyImage()">Copiar imagem</button>
    </div>
  </div>
  <p class="tip">A conversão acontece localmente no seu navegador — instantâneo e privado.</p>
</main>

<script>
const CHAR = { '█': [0,0], '▀': [0,1], '▄': [1,0], ' ': [1,1] };
const QUIET = 4;

function convert() {
  const start = performance.now();
  const timerEl = document.getElementById('timer');
  const errorEl = document.getElementById('error');
  const resultEl = document.getElementById('result');

  errorEl.textContent = '';
  resultEl.style.display = 'none';
  timerEl.textContent = '⏱ 0.00s';

  const tick = setInterval(() => {
    timerEl.textContent = '⏱ ' + ((performance.now() - start) / 1000).toFixed(2) + 's';
  }, 50);

  const lines = document.getElementById('input').value
    .split('\n').filter(l => l.trim().length > 0);

  if (!lines.length) {
    clearInterval(tick);
    timerEl.textContent = '';
    errorEl.textContent = 'Cole um QR code antes de converter.';
    return;
  }

  const cols = Math.max(...lines.map(l => l.length));
  const rows = lines.length;
  const scale = 10;
  const padPx = QUIET * scale;

  const totalW = (cols + QUIET * 2) * scale;
  const totalH = (rows * 2 + QUIET * 2) * scale;

  const canvas = document.createElement('canvas');
  canvas.width = totalW;
  canvas.height = totalH;
  const ctx = canvas.getContext('2d');

  const img = ctx.createImageData(totalW, totalH);
  img.data.fill(255);

  for (let row = 0; row < rows; row++) {
    const line = lines[row];
    for (let col = 0; col < cols; col++) {
      const ch = col < line.length ? line[col] : ' ';
      const [top, bot] = CHAR[ch] ?? [1, 1];
      const px = (col + QUIET) * scale;

      for (let s = 0; s < scale; s++) {
        for (let t = 0; t < scale; t++) {
          const y1 = padPx + row * 2 * scale + s;
          const i1 = (y1 * totalW + px + t) * 4;
          const v1 = top === 0 ? 0 : 255;
          img.data[i1] = img.data[i1+1] = img.data[i1+2] = v1;

          const y2 = padPx + (row * 2 + 1) * scale + s;
          const i2 = (y2 * totalW + px + t) * 4;
          const v2 = bot === 0 ? 0 : 255;
          img.data[i2] = img.data[i2+1] = img.data[i2+2] = v2;
        }
      }
    }
  }

  ctx.putImageData(img, 0, 0);

  const dataUrl = canvas.toDataURL('image/png');
  document.getElementById('output').src = dataUrl;
  document.getElementById('download').href = dataUrl;

  clearInterval(tick);
  timerEl.textContent = '✅ ' + ((performance.now() - start) / 1000).toFixed(2) + 's';

  resultEl.style.display = 'block';
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function copyImage() {
  const img = document.getElementById('output');
  const res = await fetch(img.src);
  const blob = await res.blob();
  try {
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copiado!';
    setTimeout(() => btn.textContent = 'Copiar imagem', 1800);
  } catch {
    alert('Use o botão Baixar PNG.');
  }
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) convert();
});
</script>
</body>
</html>
